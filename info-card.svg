<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 300" width="490" height="300">
  <style>
    .terminal-title { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; font-size: 13px; fill: #8b949e; font-weight: bold; }
    .terminal-text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; font-size: 13px; }
  </style>
  <rect width="490" height="300" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
